<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DocHub - Global Medical Network</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* 1. Force the screen to be exactly the size of the window */
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden; /* Stops the whole page from bouncing/sticking */
    }

    /* 2. Create the Split Layout */
    .app-wrapper {
      display: flex;
      height: 100vh;
      width: 100vw;
    }

    /* 3. Sidebar: Fixed on left for desktop, hidden on mobile */
    #sidebar { 
      width: 320px; 
      min-width: 320px; 
      height: 100%; 
      background: white; 
      border-right: 1px solid #e5e7eb;
      display: flex;
      flex-direction: column;
      z-index: 50;
      transition: transform 0.3s ease;
    }

    /* 4. Main Content: This is the only part that scrolls */
    main { 
      flex: 1;
      height: 100%;
      overflow-y: auto; 
      background: #f9fafb;
      -webkit-overflow-scrolling: touch; /* Smooth scroll for iPhones */
    }

    /* 5. Mobile Adjustments */
    @media (max-width: 768px) {
      #sidebar {
        position: fixed;
        left: 0;
        top: 0;
        transform: translateX(-100%); /* Slide it off screen */
      }
      #sidebar.active {
        transform: translateX(0); /* Slide it in */
      }
      .mobile-header {
        display: flex;
      }
    }
    
    .mobile-header {
      display: none;
      padding: 1rem;
      background: white;
      border-bottom: 1px solid #e5e7eb;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 40;
    }
  </style>
</head>
<body class="font-sans">

  <div class="app-wrapper">
    <aside id="sidebar" class="shadow-xl">
      <div class="p-8 border-b border-gray-100 flex justify-between items-center">
        <div>
          <h2 class="text-3xl font-black text-blue-900 tracking-tighter">DocHub</h2>
          <p class="text-xs text-blue-500 font-bold uppercase mt-1">Network</p>
        </div>
        <button onclick="toggleSidebar()" class="md:hidden text-gray-400"><i class="fa-solid fa-xmark text-2xl"></i></button>
      </div>

      <div class="p-6 bg-blue-50/50 flex-1">
        <div id="loggedInView" class="hidden space-y-4">
          <div class="bg-white p-4 rounded-2xl border border-blue-200 shadow-sm">
            <p class="text-xs text-gray-400 font-bold uppercase mb-1">Authenticated</p>
            <p class="text-lg font-bold text-blue-900 italic">Dr. <span id="currentDoctorName"></span></p>
          </div>
          <button onclick="toggleUploadModal()" class="w-full bg-emerald-600 text-white font-black py-4 rounded-2xl shadow-lg active:scale-95 transition-all flex items-center justify-center gap-2">
            <i class="fa-solid fa-cloud-arrow-up"></i> Share Report
          </button>
          <button onclick="logout()" class="w-full text-xs text-gray-400 font-bold mt-4 hover:text-red-500">LOGOUT</button>
        </div>

        <div id="loggedOutView" class="space-y-4">
          <button onclick="toggleAuthModal()" class="w-full bg-blue-600 text-white font-black py-4 rounded-2xl shadow-lg active:scale-95 transition-all">
            <i class="fa-solid fa-user-md mr-2"></i> DOCTOR LOGIN
          </button>
        </div>
      </div>
    </aside>

    <main>
      <div class="mobile-header">
        <span class="font-black text-blue-900 text-xl">DocHub</span>
        <button onclick="toggleSidebar()" class="bg-blue-50 text-blue-600 p-2 rounded-lg">
          <i class="fa-solid fa-bars-staggered"></i>
        </button>
      </div>

      <div class="p-6 md:p-16 max-w-4xl mx-auto">
        <div class="text-center mb-12">
          <h1 class="text-4xl md:text-5xl font-black text-gray-900 mb-4 tracking-tight">Search All Reports</h1>
          <p class="text-lg text-gray-500">Global Medical Network Connection</p>
        </div>

        <div class="bg-white p-6 md:p-8 rounded-3xl shadow-2xl border border-gray-100 space-y-4 mb-12">
          <div class="relative">
            <i class="fa-solid fa-search absolute left-5 top-1/2 -translate-y-1/2 text-gray-400"></i>
            <input type="text" id="searchInput" placeholder="Search by disease or doctor..." 
                   class="w-full pl-14 pr-6 py-5 bg-gray-50 border-2 border-transparent rounded-2xl focus:border-blue-500 focus:bg-white outline-none transition-all text-lg font-medium">
          </div>
          <button onclick="fetchReports()" class="w-full bg-blue-600 text-white font-black py-5 rounded-2xl shadow-xl active:scale-95 transition-all text-xl uppercase">
            Search Now (GO)
          </button>
        </div>

        <div class="space-y-6">
          <h3 id="resultsCount" class="text-sm font-black text-gray-400 uppercase tracking-widest">Ready</h3>
          <div id="reportsGrid" class="grid grid-cols-1 md:grid-cols-2 gap-6 pb-20"></div>
        </div>
      </div>
    </main>
  </div>

  <div id="authModal" class="fixed inset-0 bg-gray-900/80 backdrop-blur-md z-[100] flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-3xl p-10 w-full max-w-md">
      <h3 class="font-black text-2xl mb-6">Doctor Entry</h3>
      <input type="text" id="regName" placeholder="Enter Full Name" class="w-full p-5 bg-gray-50 border rounded-2xl mb-6 outline-none font-bold">
      <button onclick="register()" class="w-full bg-blue-600 text-white py-5 rounded-2xl font-black shadow-xl">ENTER HUB</button>
      <button onclick="toggleAuthModal()" class="w-full mt-4 text-gray-400 font-bold">CANCEL</button>
    </div>
  </div>

  <div id="uploadModal" class="fixed inset-0 bg-gray-900/80 backdrop-blur-md z-[100] flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-3xl p-10 w-full max-w-lg">
      <h3 class="font-black text-2xl mb-6 text-emerald-900">Publish Report</h3>
      <input type="text" id="reportTitle" placeholder="Report Title" class="w-full p-5 bg-gray-50 border rounded-2xl mb-4 font-bold outline-none">
      <input type="url" id="driveUrl" placeholder="Google Drive Link" class="w-full p-5 bg-gray-50 border rounded-2xl mb-6 font-bold outline-none">
      <button onclick="saveToCloud()" class="w-full bg-emerald-600 text-white py-5 rounded-2xl font-black shadow-xl">PUBLISH NOW</button>
      <button onclick="toggleUploadModal()" class="w-full mt-4 text-gray-400 font-bold">DISCARD</button>
    </div>
  </div>

  <script>
    // --- SUPABASE CONFIG ---
    const SUPABASE_URL = 'https://qkvzkqodunfohpgmjglu.supabase.co'; 
    const SUPABASE_KEY = 'sb_publishable_EsxuW-76Zk9llKyt7627iQ_qOJKMeJl'; 
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let loggedInDoctor = JSON.parse(localStorage.getItem('docHub_session'));

    window.onload = () => {
      if(loggedInDoctor) {
        document.getElementById('loggedInView').classList.remove('hidden');
        document.getElementById('loggedOutView').classList.add('hidden');
        document.getElementById('currentDoctorName').innerText = loggedInDoctor.name;
      }
      fetchReports();
    };

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('active');
    }

    async function fetchReports() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const countLabel = document.getElementById('resultsCount');
      countLabel.innerText = "Syncing...";

      let { data, error } = await supabaseClient.from('reports').select('*').order('created_at', { ascending: false });
      if (error) return console.error(error);

      if (query) {
        data = data.filter(r => r.title.toLowerCase().includes(query) || r.doctor_name.toLowerCase().includes(query));
      }
      render(data || []);
      if(window.innerWidth < 768) toggleSidebar(); // Close sidebar on mobile after clicking search
    }

    async function saveToCloud() {
      const title = document.getElementById('reportTitle').value.trim();
      const url = document.getElementById('driveUrl').value.trim();
      if(!title || !url || !loggedInDoctor) return alert("Fill all fields.");

      const { error } = await supabaseClient.from('reports').insert([{ 
        title, drive_url: url, doctor_name: loggedInDoctor.name 
      }]);

      if (!error) {
        toggleUploadModal();
        fetchReports();
      }
    }

    function render(data) {
      const grid = document.getElementById('reportsGrid');
      document.getElementById('resultsCount').innerText = `${data.length} GLOBAL REPORTS FOUND`;
      grid.innerHTML = data.map(r => `
        <div class="bg-white border border-gray-100 p-8 rounded-[2rem] shadow-sm hover:shadow-xl transition-all">
          <h3 class="text-2xl font-black text-gray-900 mb-2">${r.title}</h3>
          <p class="text-sm font-bold text-gray-400 italic mb-6">Dr. ${r.doctor_name}</p>
          <a href="${r.drive_url}" target="_blank" class="flex items-center justify-center gap-2 bg-blue-600 text-white font-black py-4 rounded-2xl hover:bg-blue-800 transition shadow-md">
            VIEW DOCUMENT
          </a>
        </div>
      `).join('') || '<div class="col-span-full text-center py-20 text-gray-400 font-bold uppercase">No records found.</div>';
    }

    function register() {
      const name = document.getElementById('regName').value;
      if(!name) return;
      localStorage.setItem('docHub_session', JSON.stringify({name}));
      location.reload();
    }
    function logout() { localStorage.removeItem('docHub_session'); location.reload(); }
    function toggleAuthModal() { document.getElementById('authModal').classList.toggle('hidden'); }
    function toggleUploadModal() { document.getElementById('uploadModal').classList.toggle('hidden'); }
  </script>
</body>
</html>
