<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DocHub - Global Network</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Ensures the sidebar and main content fit the screen perfectly */
    body { height: 100vh; display: flex; overflow: hidden; }
    #sidebar { min-width: 300px; max-width: 300px; height: 100%; }
    main { flex-grow: 1; height: 100%; overflow-y: auto; }
  </style>
</head>
<body class="bg-gray-50 font-sans">

  <aside id="sidebar" class="bg-white border-r border-gray-200 flex flex-col shadow-sm">
    <div class="p-6 border-b border-gray-100">
      <h2 class="text-2xl font-extrabold text-blue-900 tracking-tight">DocHub</h2>
      <p class="text-xs text-gray-500 uppercase tracking-widest mt-1">Medical Network</p>
    </div>

    <div class="p-4 bg-blue-50/50 flex-1">
      <div id="loggedInView" class="hidden space-y-3">
        <div class="bg-white p-3 rounded-xl border border-blue-100 shadow-sm">
          <p class="text-xs text-gray-500 mb-1">Logged in as:</p>
          <p class="text-sm font-bold text-blue-900 italic">Dr. <span id="currentDoctorName"></span></p>
        </div>
        <button onclick="toggleUploadModal()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow-md transition-all active:scale-95">
          <i class="fa-solid fa-plus-circle mr-2"></i>Upload Report
        </button>
        <button onclick="logout()" class="w-full text-xs text-gray-400 hover:text-red-500 transition-colors">
          <i class="fa-solid fa-right-from-bracket mr-1"></i>Sign Out
        </button>
      </div>

      <div id="loggedOutView" class="space-y-4">
        <p class="text-sm text-gray-600 px-2">Login to contribute to the global directory.</p>
        <button onclick="toggleAuthModal()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-md transition-all active:scale-95">
          <i class="fa-solid fa-user-md mr-2"></i>Doctor Login
        </button>
      </div>
    </div>
  </aside>

  <main class="p-6 md:p-12">
    <div class="max-w-3xl mx-auto w-full">
      <header class="text-center mb-10">
        <h1 class="text-4xl font-black text-gray-900 mb-3">Search Global Reports</h1>
        <p class="text-gray-500">Access and filter shared medical documentation across the network.</p>
      </header>

      <div class="bg-white p-6 rounded-2xl shadow-xl border border-gray-100 space-y-4 mb-10">
        <div class="relative group">
          <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-blue-500 transition-colors"></i>
          <input type="text" id="searchInput" placeholder="Search by cancer type, region, or doctor..." 
                 class="w-full pl-12 pr-4 py-4 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none transition-all">
        </div>
        
        <button onclick="fetchReports()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-4 rounded-xl shadow-lg active:scale-95 transition-all flex items-center justify-center gap-3 text-lg">
          SEARCH NOW (GO)
        </button>
      </div>

      <div class="space-y-6">
        <div class="flex items-center justify-between border-b border-gray-200 pb-4">
          <h3 id="resultsCount" class="text-sm font-bold text-gray-400 uppercase tracking-widest italic">Syncing Directory...</h3>
        </div>
        <div id="reportsGrid" class="grid grid-cols-1 gap-4">
          </div>
      </div>
    </div>
  </main>

  <div id="authModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl p-8 w-full max-w-sm shadow-2xl">
      <h3 class="font-bold text-2xl mb-2 text-gray-900 text-center">Doctor Access</h3>
      <p class="text-gray-500 text-center mb-6 text-sm">Identify yourself to share reports.</p>
      <input type="text" id="regName" placeholder="Full Name (e.g., Dr. Smith)" class="w-full p-4 border rounded-xl mb-4 outline-none focus:ring-2 focus:ring-blue-500">
      <button onclick="register()" class="w-full bg-blue-600 text-white py-4 rounded-xl font-bold text-lg shadow-lg">Confirm Entry</button>
      <button onclick="toggleAuthModal()" class="w-full mt-3 text-gray-400 text-sm">Cancel</button>
    </div>
  </div>

  <div id="uploadModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl p-8 w-full max-w-md shadow-2xl">
      <h3 class="font-bold text-2xl mb-6 text-emerald-800">Share New Document</h3>
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Report Title</label>
          <input type="text" id="reportTitle" placeholder="e.g., Registre de Cancer Alger 2024" class="w-full p-4 border rounded-xl outline-none focus:ring-2 focus:ring-emerald-500">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Google Drive Link</label>
          <input type="url" id="driveUrl" placeholder="https://drive.google.com/..." class="w-full p-4 border rounded-xl outline-none focus:ring-2 focus:ring-emerald-500">
        </div>
      </div>
      <button onclick="saveToCloud()" class="w-full bg-emerald-600 text-white py-4 rounded-xl font-bold text-lg shadow-lg mt-8">Publish to Network</button>
      <button onclick="toggleUploadModal()" class="w-full mt-3 text-gray-400 text-sm">Discard</button>
    </div>
  </div>

  <script>
    // --- SUPABASE SETUP ---
    const SUPABASE_URL = 'https://qkvzkqodunfohpgmjglu.supabase.co'; 
    const SUPABASE_KEY = 'sb_publishable_EsxuW-76Zk9llKyt7627iQ_qOJKMeJl'; 
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let loggedInDoctor = JSON.parse(localStorage.getItem('docHub_session'));

    window.onload = () => {
      if(loggedInDoctor) {
        document.getElementById('loggedInView').classList.remove('hidden');
        document.getElementById('loggedOutView').classList.add('hidden');
        document.getElementById('currentDoctorName').innerText = loggedInDoctor.name;
      }
      fetchReports();
    };

    // SEARCH LOGIC
    async function fetchReports() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const countLabel = document.getElementById('resultsCount');
      countLabel.innerText = "Querying Global Database...";

      let { data, error } = await supabaseClient
        .from('reports')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        countLabel.innerText = "Connection Error";
        return;
      }

      if (query) {
        data = data.filter(r => 
          r.title.toLowerCase().includes(query) || 
          r.doctor_name.toLowerCase().includes(query)
        );
      }
      render(data || []);
    }

    // UPLOAD LOGIC
    async function saveToCloud() {
      const title = document.getElementById('reportTitle').value.trim();
      const url = document.getElementById('driveUrl').value.trim();
      
      if(!title || !url || !loggedInDoctor) return alert("Missing information.");

      const { error } = await supabaseClient.from('reports').insert([{ 
        title, drive_url: url, doctor_name: loggedInDoctor.name 
      }]);

      if (!error) {
        toggleUploadModal();
        fetchReports();
      } else {
        alert("Error: " + error.message);
      }
    }

    function render(data) {
      const grid = document.getElementById('reportsGrid');
      document.getElementById('resultsCount').innerText = `${data.length} Report(s) Available Globally`;
      
      grid.innerHTML = data.length ? data.map(r => `
        <div class="bg-white border border-gray-100 p-6 rounded-2xl shadow-sm hover:shadow-md hover:border-blue-300 transition-all group">
          <div class="flex justify-between items-start mb-4">
            <div>
              <h3 class="text-xl font-bold text-gray-900 group-hover:text-blue-700 transition-colors">${r.title}</h3>
              <p class="text-sm text-gray-500 italic mt-1">Shared by Dr. ${r.doctor_name}</p>
            </div>
          </div>
          <a href="${r.drive_url}" target="_blank" class="inline-flex items-center gap-2 bg-blue-50 text-blue-700 font-bold px-6 py-3 rounded-xl hover:bg-blue-600 hover:text-white transition-all w-full justify-center">
            <i class="fa-brands fa-google-drive"></i> Open Shared Document
          </a>
        </div>
      `).join('') : '<div class="text-center py-20 bg-white rounded-3xl border-2 border-dashed border-gray-100 text-gray-400">No matching reports found.</div>';
    }

    // AUTH HELPERS
    function register() {
      const name = document.getElementById('regName').value;
      if(!name) return;
      localStorage.setItem('docHub_session', JSON.stringify({name}));
      location.reload();
    }
    function logout() { localStorage.removeItem('docHub_session'); location.reload(); }
    function toggleAuthModal() { document.getElementById('authModal').classList.toggle('hidden'); }
    function toggleUploadModal() { document.getElementById('uploadModal').classList.toggle('hidden'); }
  </script>
</body>
</html>
